<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            background-color: green;
        }
    </style>
</head>

<body>
    <button>register</button> <button>Login</button>
    <div id="result">

    </div>
    <script>
      const btn1 = document.querySelectorAll("button")[0];
      const btn2 = document.querySelectorAll("button")[1];
      const result = document.getElementById("result");
     btn1.addEventListener("click",()=>{
       result.innerHTML =`
       <form>
        <h3>Register</h3>
        <input type="text" placeholder="Create username"> <br>
        <input type="password" placeholder="Create password"> <br>
 <button>Register</button>
        </form>
       `;
    
     })
       btn2.addEventListener("click",()=>{
               result.innerHTML =`
       <form >
        <h3>Register</h3>
        <input type="text" placeholder="Enter created username"> <br>
        <input type="password" placeholder="Enter your password"> <br>
       <button>Login</button>
        </form>
       `;
     })
    </script>
</body>
</html>
